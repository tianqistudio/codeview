<nav class="scan-tabs" aria-label="工具"><button id="tableMode" aria-pressed="true">清单出码</button><button id="scanMode" aria-pressed="false">图片识码</button></nav>
<section id="scanner" class="scan-panel card" hidden aria-label="图片识码">
  <div class="scan-toolbar">
    <button id="scanCamera" class="primary" type="button"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h4l2-3h4l2 3h4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/><circle cx="12" cy="12.5" r="4"/></svg><span>打开相机</span></button>
    <button id="scanPick" type="button" title="选择图片" aria-label="选择图片"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 16 5-5 5 5 3-3 5 5"/><circle cx="15.5" cy="8.5" r="1.5"/></svg><span>选择图片</span></button>
    <button id="scanCancel" type="button" hidden><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg><span>取消</span></button>
    <button id="scanClear" class="scan-icon-button" type="button" title="清空" aria-label="清空"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></button>
    <input id="scanFiles" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" multiple hidden>
  </div>
  <p class="scan-input-hint small muted">支持多选、拖入或粘贴图片</p>
  <fieldset class="scan-filters">
    <legend><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-7 8v6l-4 2v-8Z"/></svg><span>显示筛选</span></legend>
    <div class="scan-filter-head">
      <p id="scanFilterStatus" class="scan-filter-count" role="status" aria-live="polite"></p>
      <button id="scanFilterReset" type="button" title="清除所有筛选"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v6h6M3 10a9 9 0 1 1 2 9"/></svg><span>显示全部</span></button>
    </div>
    <div class="scan-filter-fields">
      <label for="scanFilterType"><span class="scan-field-label"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5v14M6 5v14M10 5v14M14 5v14M17 5v14M21 5v14"/></svg><span>内容类型</span></span><select id="scanFilterType"><option value="sn" selected>SN · 字母＋数字</option><option value="digits">纯数字</option><option value="all">全部</option></select></label>
      <div class="scan-prefix-field"><label class="scan-field-label" for="scanFilterPrefix"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8l10 10-8 8L3 11Z"/><circle cx="7.5" cy="7.5" r="1"/></svg><span>内容开头</span></label><div class="scan-prefix-control"><input id="scanFilterPrefix" type="text" placeholder="不限前缀" autocomplete="off" spellcheck="false"><button id="scanFilter69" type="button" aria-pressed="false" title="自动填入 69，显示所有以 69 开头的码"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 10-13h-7Z"/></svg><span>69 开头</span></button></div></div>
      <label for="scanFilterPosition"><span class="scan-field-label"><svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11M3 4h2v5M3 11h3l-3 4h3M3 18h3v4H3"/></svg><span>每图序号</span></span><input id="scanFilterPosition" type="number" min="1" max="255" step="1" inputmode="numeric" placeholder="全部" aria-describedby="scanFilterHelp"></label>
    </div>
    <details class="scan-filter-help"><summary>筛选说明</summary><p id="scanFilterHelp" class="small muted">顺序按原图从上到下、同一行从左到右；留空显示全部。SN 须同时含英文字母和数字，且不含其他字符。</p></details>
  </fieldset>
  <!-- CAMERA_CONTROLS -->
  <p id="scanStatus" role="status" aria-live="polite">等待图片</p>
  <div id="scanResults" class="scan-results"></div>
  <details><summary>识别与保存说明</summary><p>支持常见二维码及 Code 128、Code 39、EAN、UPC 等条形码。模糊、遮挡或过小的码可能漏识别，请核对数量与内容。重复标签分别保留。每张图片最多识别 255 个码；大图建议分批裁剪。</p><p>文件名使用码内文本，非法字符替换为下划线，过长名称截短，重名追加序号；编码内容保持原样。图片仅在本机处理。单张图片上限 50 MB、2400 万像素。</p></details>
</section>
